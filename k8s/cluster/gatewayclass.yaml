# Cluster-scoped: binds the "bondcheck-envoy" class to the Envoy Gateway controller.
# Applied by scripts/k8s-up.sh right after Envoy Gateway is installed.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: bondcheck-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
