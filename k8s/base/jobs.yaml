# Schema migration (+ demo seed into an empty database), run once per deploy.
# Jobs are immutable, so scripts/k8s-up.sh deletes the previous one before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: bondcheck-migrate
  labels:
    app.kubernetes.io/name: bondcheck-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6                  # retries while Postgres is still starting
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bondcheck-migrate
        bondcheck.dev/db-access: "true"
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: bondcheck-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "db.migrate", "--seed-if-empty"]
          envFrom:
            - configMapRef:
                name: bondcheck-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bondcheck-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://bondcheck:$(POSTGRES_PASSWORD)@postgres:5432/bondcheck
            - name: BONDCHECK_OFFLINE      # seed with the deterministic engine: free and reproducible
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# Proactive agents on a schedule (replaces the GitHub Actions / Vercel cron when running on Kubernetes).
# They call the API through its Service, so whichever replica is free runs the job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bondcheck-monitor
  labels:
    app.kubernetes.io/component: cron
spec:
  schedule: "0 8 * * *"
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: monitor
              image: curlimages/curl:8.11.1
              args: ["-fsS", "--max-time", "600", "-X", "POST", "-H", "Authorization: Bearer $(CRON_SECRET)",
                     "http://bondcheck-api:8000/cron/monitor"]
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: bondcheck-secrets
                      key: CRON_SECRET
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bondcheck-alerts
  labels:
    app.kubernetes.io/component: cron
spec:
  schedule: "15 8 * * *"           # after the Monitor Agent has refreshed coverage
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: alerts
              image: curlimages/curl:8.11.1
              args: ["-fsS", "--max-time", "600", "-X", "POST", "-H", "Authorization: Bearer $(CRON_SECRET)",
                     "http://bondcheck-api:8000/cron/alerts"]
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: bondcheck-secrets
                      key: CRON_SECRET
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
