# Least-privilege networking inside the namespace.
# PostgreSQL: only pods labelled bondcheck.dev/db-access=true (API pods, migrate Job) may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-app-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              bondcheck.dev/db-access: "true"
      ports:
        - port: 5432
---
# API: reachable from the Envoy gateway, from other API pods (confirmation forwarding),
# and from the cron jobs. Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-gateway-and-peers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bondcheck-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bondcheck-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cron
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-allow-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bondcheck-frontend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: 3000
