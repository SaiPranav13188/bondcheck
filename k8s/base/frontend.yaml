# BondCheck frontend (Next.js standalone server). The browser calls the API at the same-origin
# path /backend, which the HTTPRoute sends to the API Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bondcheck-frontend
  labels:
    app.kubernetes.io/name: bondcheck-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bondcheck-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bondcheck-frontend
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # the image's `node` user
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bondcheck-frontend
      containers:
        - name: frontend
          image: bondcheck-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: bondcheck-frontend
  labels:
    app.kubernetes.io/name: bondcheck-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bondcheck-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bondcheck-frontend
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bondcheck-frontend
